services:
  caddy:
    image: caddy:2-alpine
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker-data/caddy/data:/data
      - ./docker-data/caddy/config:/config
