name: emma-cookbook

services:
  db:
    image: postgres:15
    env_file:
      - ${ENV_FILE:-.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ${EMMA_BACKEND_IMAGE:-local/emma-cookbook-backend}:${EMMA_VERSION:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${EMMA_VERSION:-dev}
        APP_GIT_SHA: ${EMMA_GIT_SHA:-local}
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
      - ./docker-data/vosk:/app/vosk-model
      - ./docker-data/import-cookies:/app/import-cookies:ro
      - ./docker-data/bootstrap:/bootstrap
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    image: ${EMMA_BACKEND_IMAGE:-local/emma-cookbook-backend}:${EMMA_VERSION:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${EMMA_VERSION:-dev}
        APP_GIT_SHA: ${EMMA_GIT_SHA:-local}
    command: celery -A cookbook worker -l info
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
      - ./docker-data/vosk:/app/vosk-model
      - ./docker-data/import-cookies:/app/import-cookies:ro
      - ./docker-data/bootstrap:/bootstrap
    extra_hosts:
      - "host.docker.internal:host-gateway"

  beat:
    image: ${EMMA_BACKEND_IMAGE:-local/emma-cookbook-backend}:${EMMA_VERSION:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${EMMA_VERSION:-dev}
        APP_GIT_SHA: ${EMMA_GIT_SHA:-local}
    command: celery -A cookbook beat -l info
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
      - ./docker-data/vosk:/app/vosk-model
      - ./docker-data/import-cookies:/app/import-cookies:ro
      - ./docker-data/bootstrap:/bootstrap
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    container_name: emma-cookbook
    image: ${EMMA_FRONTEND_IMAGE:-local/emma-cookbook-frontend}:${EMMA_VERSION:-dev}
    build:
      context: .
      dockerfile: cookbook-app/Dockerfile
      args:
        APP_VERSION: ${EMMA_VERSION:-dev}
        APP_GIT_SHA: ${EMMA_GIT_SHA:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HTTP_BIND:-127.0.0.1:8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
